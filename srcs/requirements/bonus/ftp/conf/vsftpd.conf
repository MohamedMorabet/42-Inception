listen=YES
listen_ipv6=NO
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/html
secure_chroot_dir=/var/run/vsftpd/empty

pam_service_name=vsftpd
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
port_enable=NO

ssl_enable=NO
