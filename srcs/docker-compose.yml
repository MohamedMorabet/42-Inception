services:
  redis:
    build: ./requirements/bonus/redis
    image: redis:inception
    restart: unless-stopped
    networks:
      - inception
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is missing}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is missing}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is missing}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is missing}
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is missing}
      WP_TITLE: ${WP_TITLE:?WP_TITLE is missing}
      WP_OWNER_USER: ${WP_OWNER_USER:?WP_OWNER_USER is missing}
      WP_OWNER_EMAIL: ${WP_OWNER_EMAIL:?WP_OWNER_EMAIL is missing}
      WP_USER: ${WP_USER:?WP_USER is missing}
      WP_USER_EMAIL: ${WP_USER_EMAIL:?WP_USER_EMAIL is missing}
    secrets:
      - db_password
      - wp_owner_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    restart: unless-stopped
    depends_on:
      - wordpress
      - static-site
      - adminer
      - monit
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    
  ftp:
    build: ./requirements/bonus/ftp
    image: ftp:inception
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      FTP_USER: ${FTP_USER:?FTP_USER is missing}
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS:?FTP_PASV_ADDRESS is missing}
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
  
  static-site:
    build: ./requirements/bonus/static-site
    image: static-site:inception
    restart: unless-stopped
    networks:
      - inception

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:inception
    restart: unless-stopped
    depends_on:
      - mariadb
    networks:
      - inception

  monit:
    build: ./requirements/bonus/monit
    image: monit:inception
    restart: unless-stopped
    secrets:
      - monitor_password
    networks:
      - inception

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_owner_password:
    file: ../secrets/wp_owner_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
  monitor_password:
    file: ../secrets/monitor_password.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mel-mora/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mel-mora/data/wordpress

networks:
  inception:
    driver: bridge
