services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is missing}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is missing}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is missing}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is missing}
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is missing}
      WP_TITLE: ${WP_TITLE:?WP_TITLE is missing}
      WP_OWNER_USER: ${WP_OWNER_USER:?WP_OWNER_USER is missing}
      WP_OWNER_EMAIL: ${WP_OWNER_EMAIL:?WP_OWNER_EMAIL is missing}
      WP_USER: ${WP_USER:?WP_USER is missing}
      WP_USER_EMAIL: ${WP_USER_EMAIL:?WP_USER_EMAIL is missing}
    secrets:
      - db_password
      - wp_owner_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_owner_password:
    file: ../secrets/wp_owner_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mel-mora/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mel-mora/data/wordpress

networks:
  inception:
    driver: bridge
